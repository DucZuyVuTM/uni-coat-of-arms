services:
  # 1. Rust App
  app:
    build: .
    container_name: rust_app
    ports:
      - "8000:8080"
    environment:
      - DATABASE_URL=postgres://user:password@postgres:5432/db
      - RUST_LOG=info
    depends_on:
      - postgres
    networks:
      - monitoring_net

  # 2. PostgreSQL Database
  postgres:
    image: postgres:16
    container_name: postgres_db
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d db"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - monitoring_net

  # 3. Adminer (Interface for Database Management)
  adminer:
    image: adminer:latest
    container_name: adminer
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - monitoring_net

  # 4. Prometheus (Metrics Collector)
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - monitoring_net

  # 5. Grafana (Data Visualization)
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    networks:
      - monitoring_net

  # 6. --- Graylog Stack: MongoDB, ElasticSearch ---
  mongodb:
    image: mongo:6.0
    container_name: graylog_mongo
    volumes:
      - mongo_data:/data/db
    networks:
      - monitoring_net

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.9
    container_name: graylog_es
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m # Set RAM limit
      - xpack.security.enabled=false
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - monitoring_net

  graylog:
    image: graylog/graylog:5.1
    container_name: graylog
    depends_on:
      - mongodb
      - elasticsearch
    environment:
      # Default hashed admin password is "admin"
      - GRAYLOG_PASSWORD_SECRET=somepasswordpepper
      - GRAYLOG_ROOT_PASSWORD_SHA2=8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918
      - GRAYLOG_HTTP_EXTERNAL_URI=http://127.0.0.1:9000/
      - GRAYLOG_ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - GRAYLOG_MONGODB_URI=mongodb://mongodb:27017/graylog
    ports:
      - "9000:9000"       # Web interface
      - "12201:12201/udp" # Port for GELF UDP logs
    networks:
      - monitoring_net
  # ------------------------------------------------

  # 7. --- Zabbix Stack: DB, Server, Web ---
  zabbix-db:
    image: postgres:16
    container_name: zabbix_db
    environment:
      - POSTGRES_USER=zabbix
      - POSTGRES_PASSWORD=zabbix_pwd
      - POSTGRES_DB=zabbix
    networks:
      - monitoring_net

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:alpine-latest
    container_name: zabbix_server
    environment:
      - DB_SERVER_HOST=zabbix-db
      - POSTGRES_USER=zabbix
      - POSTGRES_PASSWORD=zabbix_pwd
      - POSTGRES_DB=zabbix
    depends_on:
      - zabbix-db
    networks:
      - monitoring_net

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:alpine-latest
    container_name: zabbix_web
    environment:
      - ZBX_SERVER_HOST=zabbix-server
      - DB_SERVER_HOST=zabbix-db
      - POSTGRES_USER=zabbix
      - POSTGRES_PASSWORD=zabbix_pwd
      - POSTGRES_DB=zabbix
    ports:
      - "8081:8080" # Access into http://localhost:8081
    depends_on:
      - zabbix-server
    networks:
      - monitoring_net
  # ----------------------------------------

# Volume initialization for storing persistent data
volumes:
  postgres_data:
  prometheus_data:
  mongo_data:
  es_data:

# Network initialization for communication between containers
networks:
  monitoring_net:
    driver: bridge

global:
  scrape_interval: 1s  # Prometheus will collect data every 1 second

scrape_configs:
  # Config for self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Config for monitoring Rust App
  # Endpoint /metrics required in Rust App
  - job_name: 'rust_app'
    static_configs:
      - targets: ['app:8080']